name: Notebook end-to-end checks

on:
  push:
    branches: ["main", "audit/**", "repair/**"]
  pull_request:
permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Download the official dataset and execute the canonical notebook
        run: |
          curl -L --fail --retry 3 -o /tmp/online-retail.zip https://archive.ics.uci.edu/static/public/352/online+retail.zip
          unzip -o /tmp/online-retail.zip -d .
          test -f 'Online Retail.xlsx'
          jupyter nbconvert --to notebook --execute "Task_2_Retail_Demand_Basket_Analysis_Srishti_Pandey (2).ipynb" --output executed_retail.ipynb --ExecutePreprocessor.timeout=1200
      - name: Verify notebook execution, outputs and date range
        run: |
          python - <<'PY'
          import nbformat
          from pathlib import Path

          executed = Path("executed_retail.ipynb")
          assert executed.is_file(), "Executed notebook was not created."
          nb = nbformat.read(executed, as_version=4)
          cells = [
              cell for cell in nb.cells
              if cell.cell_type == "code" and cell.source.strip()
          ]
          assert len(cells) == 19, f"Expected 19 non-empty code cells, found {len(cells)}."
          assert all(cell.execution_count is not None for cell in cells), (
              "At least one non-empty code cell was not executed."
          )
          errors = [
              (index, output.ename, output.evalue)
              for index, cell in enumerate(nb.cells)
              if cell.cell_type == "code"
              for output in cell.get("outputs", [])
              if output.output_type == "error"
          ]
          assert not errors, errors
          assert any(
              output.output_type in {"display_data", "execute_result"}
              for cell in cells
              for output in cell.get("outputs", [])
          ), "Notebook produced no rendered outputs."
          all_text = "\\n".join(
              output.text if isinstance(output.text, str) else "".join(output.text)
              for cell in cells
              for output in cell.get("outputs", [])
              if output.output_type == "stream"
          )
          assert "PASS: All final validation checks passed." in all_text, (
              "Final notebook validation did not report PASS."
          )
          print(f"Executed {len(cells)} non-empty code cells without errors.")
          PY
